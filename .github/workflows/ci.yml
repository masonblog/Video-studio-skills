name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck-components:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/react-animation-components
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck

  check-python-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m py_compile skills/video-studio-orchestrator/scripts/*.py
